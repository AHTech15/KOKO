<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22c55e">
  <title>KoKo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body>

  <!-- Login / Sign up screen -->
  <div class="auth" id="authScreen" hidden>
    <div class="auth-card">
      <svg class="logo big" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="6" width="38" height="30" rx="14" fill="#22c55e"/>
        <polygon points="12,34 10,47 23,35" fill="#22c55e"/>
        <rect x="22" y="22" width="38" height="30" rx="14" fill="#3b82f6" stroke="var(--panel)" stroke-width="3"/>
        <polygon points="52,50 56,61 41,51" fill="#3b82f6"/>
      </svg>
      <h1>KoKo</h1>
      <p class="tagline">Chat with the people you love</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">Log in</button>
        <button type="button" class="auth-tab" data-mode="signup">Sign up</button>
      </div>

      <form class="auth-form" id="authForm">
        <div id="nameRow" hidden>
          <label for="displayName">Your name</label>
          <input id="displayName" type="text" maxlength="30" autocomplete="name">
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email">
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" required minlength="6" autocomplete="current-password">
        </div>
        <p class="auth-error" id="authError" role="alert"></p>
        <button type="submit" class="auth-submit" id="authSubmit">Log in</button>
      </form>
      <p class="auth-note">Use a password you don't use anywhere else.</p>
    </div>
  </div>

  <!-- Main app (shown after login) -->
  <div class="app" id="app" hidden>

    <aside class="sidebar">
      <header class="side-head">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="6" width="38" height="30" rx="14" fill="#22c55e"/>
          <polygon points="12,34 10,47 23,35" fill="#22c55e"/>
          <rect x="22" y="22" width="38" height="30" rx="14" fill="#3b82f6" stroke="var(--panel)" stroke-width="3"/>
          <polygon points="52,50 56,61 41,51" fill="#3b82f6"/>
        </svg>
        <span class="brand">KoKo</span>
        <button type="button" class="me-btn" id="meBtn" aria-label="My profile"></button>
        <button type="button" class="logout" id="logoutBtn">Log out</button>
      </header>
      <p class="user-line" id="userLine"></p>

      <div class="search">
        <input id="search" type="search" placeholder="Search" aria-label="Search">
      </div>

      <div class="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="direct">Chats</button>
        <button class="tab" data-filter="group">Groups</button>
        <button class="tab" data-filter="people">People</button>
      </div>

      <ul class="chat-list" id="chatList"></ul>
      <ul class="chat-list" id="peopleList" hidden></ul>
    </aside>

    <main class="chat">
      <div class="empty" id="empty">
        <svg class="logo big" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="6" width="38" height="30" rx="14" fill="#22c55e"/>
          <polygon points="12,34 10,47 23,35" fill="#22c55e"/>
          <rect x="22" y="22" width="38" height="30" rx="14" fill="#3b82f6" stroke="var(--bg)" stroke-width="3"/>
          <polygon points="52,50 56,61 41,51" fill="#3b82f6"/>
        </svg>
        <h2>Welcome to KoKo</h2>
        <p>Pick a chat, or find someone in People.</p>
      </div>

      <section class="convo" id="convo" hidden>
        <header class="convo-head">
          <button class="back" id="backBtn" aria-label="Back to chats">&#8592;</button>
          <div id="headAvatar"></div>
          <div class="who">
            <strong id="headName"></strong>
            <small id="headStatus"></small>
          </div>
        </header>

        <div class="messages" id="messages"></div>

        <form class="composer" id="composer" autocomplete="off">
          <input id="msgInput" type="text" placeholder="Type a message" aria-label="Message" maxlength="1000">
          <button type="submit" class="send" aria-label="Send">&#10148;</button>
        </form>
      </section>
    </main>

  </div>

  <!-- My profile -->
  <div class="modal" id="profileModal" hidden>
    <div class="modal-card">
      <h2>My profile</h2>
      <form class="auth-form" id="profileForm">
        <label for="pName">Name</label>
        <input id="pName" type="text" maxlength="30" required>
        <label for="pBio">About you</label>
        <textarea id="pBio" rows="3" maxlength="140"></textarea>
        <small id="bioCount">0/140</small>
        <p class="auth-error" id="profileMsg" role="alert"></p>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="profileClose">Close</button>
          <button type="submit" class="auth-submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Someone else's profile -->
  <div class="modal" id="personModal" hidden>
    <div class="modal-card person">
      <div id="personAvatar"></div>
      <h2 id="personName"></h2>
      <p class="bio" id="personBio"></p>
      <button type="button" class="auth-submit" id="personMsg">Message</button>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="personClose">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script type="module" src="chat.js"></script>
</body>
</html>
